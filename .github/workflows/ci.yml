name: Validate

on:
  pull_request:
  push:
    branches: [main, feature/public-deployment]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build production images
        run: |
          docker build --tag openagent-backend:test ./backend
          docker build --tag openagent-frontend:test ./frontend

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check Terraform formatting
        run: |
          terraform -chdir=infrastructure/terraform fmt -check -recursive
          terraform -chdir=infrastructure/cloud-run-beta fmt -check -recursive

      - uses: azure/setup-helm@v4
      - name: Render Helm chart
        run: |
          helm lint helm/openagent
          helm template openagent helm/openagent \
            --set backend.image.repository=example/backend \
            --set backend.image.tag=test \
            --set frontend.image.repository=example/frontend \
            --set frontend.image.tag=test \
            --set serviceAccount.gcpServiceAccount=openagent@example.iam.gserviceaccount.com \
            --set config.allowedOrigins=https://app.example.com \
            --set config.publicAppUrl=https://app.example.com \
            --set config.gcsBucket=example-private-bucket \
            --set config.googleCloudProject=example-project \
            --set config.redisUrl=redis://10.0.0.1:6379/0 \
            --set config.emailFrom='OpenAgent Hub <accounts@example.com>' \
            --set ingress.host=app.example.com \
            --set secrets.resources.databaseUrl=projects/example-project/secrets/database/versions/latest \
            --set secrets.resources.secretKey=projects/example-project/secrets/secret-key/versions/latest \
            --set secrets.resources.encryptionKey=projects/example-project/secrets/encryption-key/versions/latest \
            --set secrets.resources.resendApiKey=projects/example-project/secrets/resend-key/versions/latest >/dev/null
