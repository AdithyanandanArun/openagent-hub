apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "openagent.fullname" . }}-provider-health
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.healthProbe.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            {{- include "openagent.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: provider-health
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ .Values.serviceAccount.name }}
          securityContext:
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: provider-health
              image: "{{ required "backend.image.repository is required" .Values.backend.image.repository }}:{{ required "backend.image.tag is required" .Values.backend.image.tag }}"
              command: ["python", "-m", "app.health_probe_runner"]
              envFrom:
                - configMapRef: { name: {{ include "openagent.fullname" . }}-config }
                - secretRef: { name: {{ .Values.secrets.kubernetesSecretName }} }
              volumeMounts:
                - name: runtime-secrets
                  mountPath: /mnt/secrets-store
                  readOnly: true
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 1Gi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 999
          volumes:
            - name: runtime-secrets
              csi:
                driver: secrets-store-gke.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: {{ include "openagent.fullname" . }}-runtime
