{{- if .Values.ingress.enabled }}
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ .Values.ingress.managedCertificateName }}
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
spec:
  domains:
    - {{ required "ingress.host is required" .Values.ingress.host | quote }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openagent.fullname" . }}
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    networking.gke.io/managed-certificates: {{ .Values.ingress.managedCertificateName | quote }}
    {{- with .Values.ingress.staticIpName }}
    kubernetes.io/ingress.global-static-ip-name: {{ . | quote }}
    {{- end }}
spec:
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "openagent.fullname" . }}-frontend
                port: { number: 80 }
{{- end }}
