{{- if .Values.secrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "openagent.fullname" . }}-runtime
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: {{ required "secrets.resources.databaseUrl is required" .Values.secrets.resources.databaseUrl | quote }}
        path: DATABASE_URL
      - resourceName: {{ required "secrets.resources.secretKey is required" .Values.secrets.resources.secretKey | quote }}
        path: SECRET_KEY
      - resourceName: {{ required "secrets.resources.encryptionKey is required" .Values.secrets.resources.encryptionKey | quote }}
        path: ENCRYPTION_KEY
      - resourceName: {{ required "secrets.resources.resendApiKey is required" .Values.secrets.resources.resendApiKey | quote }}
        path: RESEND_API_KEY
  secretObjects:
    - secretName: {{ .Values.secrets.kubernetesSecretName }}
      type: Opaque
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: SECRET_KEY
          key: SECRET_KEY
        - objectName: ENCRYPTION_KEY
          key: ENCRYPTION_KEY
        - objectName: RESEND_API_KEY
          key: RESEND_API_KEY
{{- end }}
