apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "openagent.fullname" . }}-backend
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
spec:
  minAvailable: 2
  selector:
    matchLabels:
      {{- include "openagent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "openagent.fullname" . }}-frontend
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "openagent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
