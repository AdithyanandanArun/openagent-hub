apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openagent.fullname" . }}-migrate
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-10"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "openagent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: "{{ required "backend.image.repository is required" .Values.backend.image.repository }}:{{ required "backend.image.tag is required" .Values.backend.image.tag }}"
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: {{ include "openagent.fullname" . }}-config }
            - secretRef: { name: {{ .Values.secrets.kubernetesSecretName }} }
          volumeMounts:
            - name: runtime-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
      volumes:
        - name: runtime-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "openagent.fullname" . }}-runtime
